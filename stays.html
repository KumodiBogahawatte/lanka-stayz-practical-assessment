<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browse villas, beach houses, apartments and hideaways across Sri Lanka."
    />
    <title>Explore Stays — Lanka Stayz</title>
    <link rel="icon" href="assets/images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/components/site-shell.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </head>
  <body data-page="stays">
    <lanka-site-header page="stays"></lanka-site-header>
    <main id="main-content" tabindex="-1">
      <section class="page-hero stays-hero">
        <p class="eyebrow hero-eyebrow">
          <span></span> YOUR NEXT CHAPTER STARTS HERE
        </p>
        <h1>Find your kind<br />of <em>somewhere.</em></h1>
        <p class="hero-copy">
          Thoughtful stays from the coast to the highlands.
        </p>
      </section>
      <section class="section listing-section">
        <form class="listing-filters" id="listing-filters">
          <label
            >Destination<select name="destination" id="filter-destination">
              <option value="">All destinations</option>
              <option>Colombo</option>
              <option>Kandy</option>
              <option>Ella</option>
              <option>Galle</option>
              <option>Mirissa</option>
              <option>Nuwara Eliya</option>
              <option>Bentota</option>
              <option>Trincomalee</option>
            </select></label
          >
          <label
            >Guests<select name="guests" id="filter-guests">
              <option value="1">1 guest</option>
              <option value="2" selected>2 guests</option>
              <option value="3">3 guests</option>
              <option value="4">4 guests</option>
              <option value="5">5 guests</option>
              <option value="6">6 guests</option>
              <option value="7">7 guests</option>
              <option value="8">8 guests</option>
            </select></label
          >
          <label
            >Sort by<select name="sort" id="sort-order">
              <option value="featured">Featured</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
            </select></label
          >
          <button class="submit-button" type="submit">
            Show stays <i class="fa-solid fa-arrow-up-right-from-square action-icon" aria-hidden="true"></i>
          </button>
        </form>
        <div class="results-bar">
          <p id="results-count" aria-live="polite"></p>
          <span>Prices shown per night in LKR</span>
        </div>
        <div class="property-grid" id="property-grid"></div>
        <nav
          class="pagination"
          id="pagination"
          aria-label="Stays pages"
          hidden
        ></nav>
        <p class="empty-state" id="empty-state" hidden>
          No stays match your search just yet. Try another destination or guest
          count.
        </p>
      </section>
    </main>
    <lanka-site-footer></lanka-site-footer>
  </body>
</html>
